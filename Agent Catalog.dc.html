<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/effects.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/styles.css">
  <script src="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/_ds_bundle.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--surface-light);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
    a{color:var(--coral-deep);text-decoration:none}
    a:hover{color:var(--coral)}
    @media (prefers-reduced-motion:reduce){
      .card{transition:box-shadow 160ms ease,border-color 160ms ease !important;transform:none !important}
    }
  </style>
</helmet>

<div style="position:relative;min-height:100vh;padding:52px 56px 72px;overflow:hidden">
  <div style="position:absolute;inset:0;pointer-events:none;background-image:var(--grain);background-size:180px;opacity:0.45;z-index:0"></div>
  <div style="position:absolute;top:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,136,0.22),transparent 70%);filter:blur(24px);pointer-events:none;z-index:0"></div>
  <div style="position:absolute;bottom:-240px;left:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(155,143,212,0.16),transparent 70%);filter:blur(24px);pointer-events:none;z-index:0"></div>

  <div style="position:relative;z-index:1;max-width:1320px;margin:0 auto">

    <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:44px;flex-wrap:wrap">
      <div>
        <div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:14px">Catalog</div>
        <h1 style="margin:0;font-size:46px;font-weight:300;letter-spacing:-0.025em;line-height:1.02;color:var(--navy)">HireRight&#39;s agents &amp; automations</h1>
      </div>
      <div style="display:flex;align-items:center;gap:22px">
        <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--coral);display:inline-block"></span><span style="font-size:13px;color:var(--ink-600)">Agent</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block"></span><span style="font-size:13px;color:var(--ink-600)">Automation</span></div>
      </div>
    </header>

    <div ref="{{ setGrid }}" style="display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:132px;gap:16px">

      <!-- FEATURED (2x2) -->
      <div data-cell style="grid-column:span 2;grid-row:span 2;transform-origin:50% 82%;will-change:transform">
        <div class="card" style="height:100%;background:var(--white);border:1px solid var(--ink-100);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform 260ms var(--ease-calm),box-shadow 260ms var(--ease-calm),border-color 260ms var(--ease-calm)" style-hover="transform:translateY(-5px);box-shadow:0 22px 54px rgba(30,42,58,0.15);border-color:rgba(242,112,89,0.4)">
          <div style="height:5px;background:var(--gradient-strip);flex-shrink:0"></div>
          <div style="padding:24px 28px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0">
            <div style="display:flex;align-items:center;gap:9px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal)"></span><span style="font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-500)">Automation</span></div>
            <h2 style="margin:0;font-size:28px;font-weight:300;letter-spacing:-0.015em;color:var(--navy);line-height:1.08">Invoice follow-ups</h2>
            <p style="margin:0;font-size:15px;line-height:1.55;color:var(--ink-600);flex:1">Chases unpaid invoices for you — gently, in your voice.</p>
            <div style="height:1px;background:var(--ink-100)"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
              <div style="display:flex;align-items:center;gap:11px">
                <div style="display:flex">
                  <span style="width:30px;height:30px;border-radius:50%;background:var(--coral);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--white)">MB</span>
                  <span style="width:30px;height:30px;border-radius:50%;background:var(--lavender);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--white);margin-left:-10px">JS</span>
                  <span style="width:30px;height:30px;border-radius:50%;background:var(--amber);color:#fff;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--white);margin-left:-10px">RK</span>
                </div>
                <span style="font-size:13px;color:var(--ink-500)"><span style="font-weight:600;color:var(--navy)">1,248</span> use this</span>
              </div>
              <span style="font-size:12px;color:var(--ink-500);display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span>Active</span>
            </div>
          </div>
        </div>
      </div>

      <!-- BUILD -->
      <div data-cell style="transform-origin:50% 82%;will-change:transform">
        <div class="card" style="height:100%;position:relative;border-radius:var(--radius-xl);box-shadow:var(--shadow-md);cursor:pointer;overflow:hidden;background:var(--gradient-warm);transition:transform 260ms var(--ease-calm),box-shadow 260ms var(--ease-calm)" style-hover="transform:translateY(-5px);box-shadow:var(--shadow-glow)">
          <div style="position:absolute;inset:0;background-image:var(--grain);background-size:120px"></div>
          <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
            <div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:300;line-height:1">+</div>
            <div style="font-size:14px;font-weight:600;color:#fff">Build your own</div>
          </div>
        </div>
      </div>

      <!-- MINIMAL CELLS -->
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="18">
        <div data-cell style="transform-origin:50% 82%;will-change:transform">
          <div class="card" style="height:100%;background:var(--white);border:1px solid var(--ink-100);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);cursor:pointer;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:transform 260ms var(--ease-calm),box-shadow 260ms var(--ease-calm),border-color 260ms var(--ease-calm)" style-hover="transform:translateY(-5px);box-shadow:0 18px 40px rgba(30,42,58,0.13);border-color:rgba(30,42,58,0.14)">
            <span style="width:8px;height:8px;border-radius:50%;background:{{ it.dot }};display:inline-block"></span>
            <div style="font-size:16px;font-weight:400;letter-spacing:-0.01em;color:var(--navy);line-height:1.25;text-wrap:pretty">{{ it.name }}</div>
          </div>
        </div>
      </sc-for>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rippleStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:10,&quot;min&quot;:0,&quot;max&quot;:22,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ripple&quot;},&quot;rippleReach&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:300,&quot;min&quot;:150,&quot;max&quot;:500,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ripple&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const A = 'var(--coral)', T = 'var(--teal)';
    const raw = [
      ['Inbox triage','a'],['Review replies','a'],['Appointment reminders','t'],
      ['Weekly numbers','t'],['Restock alerts','t'],['New-client welcome','a'],
      ['Quote drafts','a'],['Expense sorting','t'],['Meeting notes','a'],
      ['Order updates','t'],['Refund requests','a'],['Supplier check-ins','a'],
      ['Waitlist fills','t'],['Contract renewals','t'],['Deposit reminders','t'],
      ['Feedback digest','a'],['Shift swaps','t'],['Lead replies','a'],
      ['Payroll prep','t'],['Birthday notes','t'],['Late reply nudges','a'],
      ['Bookkeeping tidy','t'],
    ];
    return {
      items: raw.map(([name, k]) => ({ name, dot: k === 'a' ? A : T })),
      setGrid: (el) => { if (el && el !== this._grid) { this._grid = el; this._attach(el); } },
    };
  }

  _attach(grid) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (reduce || !fine) return;

    let lastCell = null;
    let lastT = 0;

    const ripple = (src) => {
      const now = performance.now();
      if (now - lastT < 60) return;
      lastT = now;
      const strength = this.props.rippleStrength ?? 10;   // px, hovered-card lift of the wave
      const reach = this.props.rippleReach ?? 300;        // px, how far the wave carries
      const cells = grid.querySelectorAll('[data-cell]');
      const s = src.getBoundingClientRect();
      const sx = s.left + s.width / 2, sy = s.top + s.height / 2;
      cells.forEach((c) => {
        const r = c.getBoundingClientRect();
        const dx = r.left + r.width / 2 - sx;
        const dy = r.top + r.height / 2 - sy;
        const dist = Math.hypot(dx, dy);
        const amp = strength * Math.exp(-dist / reach);
        if (amp < 0.4) return;
        const delay = dist * 0.42;                         // wave travels outward
        const lean = (dx >= 0 ? 1 : -1) * amp * 0.14;      // leaves bending with the gust
        c.animate([
          { transform: 'translateY(0) rotate(0deg)' },
          { transform: `translateY(${-amp}px) rotate(${lean}deg)`, offset: 0.36 },
          { transform: 'translateY(0) rotate(0deg)' },
        ], { duration: 640, delay, easing: 'cubic-bezier(0.23,1,0.32,1)' });
      });
    };

    grid.addEventListener('pointerover', (e) => {
      const cell = e.target.closest('[data-cell]');
      if (!cell || !grid.contains(cell) || cell === lastCell) return;
      lastCell = cell;
      ripple(cell);
    });
    grid.addEventListener('pointerleave', () => { lastCell = null; });
  }
}
</script>
</body>
</html>
