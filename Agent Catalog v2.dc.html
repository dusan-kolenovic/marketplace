<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/effects.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/styles.css">
  <script src="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/_ds_bundle.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--surface-light);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
    a{color:var(--coral-deep);text-decoration:none}
    a:hover{color:var(--coral)}
    .search{transition:box-shadow 220ms var(--ease-calm),border-color 220ms var(--ease-calm)}
    .search:focus-within{border-color:rgba(242,112,89,0.45);box-shadow:var(--shadow-glow)}
    .search input{width:100%;border:0;outline:0;background:transparent;font-family:var(--font-sans);font-size:20px;font-weight:300;letter-spacing:-0.01em;color:var(--navy)}
    .search input::placeholder{color:var(--ink-400);font-weight:300}
    .addbtn{transition:width 260ms cubic-bezier(0.23,1,0.32,1),padding 260ms cubic-bezier(0.23,1,0.32,1),border-radius 260ms cubic-bezier(0.23,1,0.32,1),transform 160ms var(--ease-calm),background 160ms var(--ease-calm)}
    .addbtn{width:52px;padding:0;white-space:nowrap;overflow:hidden;border-radius:50%}
    .addbtn[data-active="1"]{width:196px;border-radius:26px;padding:0 24px}
    .addbtn-txt{transition:opacity 260ms ease}
    .addbtn:hover{background:var(--coral-deep)}
    .addbtn:active{transform:scale(0.95)}
    @media (prefers-reduced-motion:reduce){
      .card{transition:box-shadow 160ms ease,border-color 160ms ease !important;transform:none !important}
    }
  </style>
</helmet>

<div style="position:relative;min-height:100vh;padding:52px 56px 72px;overflow:hidden">
  <div style="position:absolute;inset:0;pointer-events:none;background-image:var(--grain);background-size:180px;opacity:0.45;z-index:0"></div>
  <div style="position:absolute;top:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,136,0.22),transparent 70%);filter:blur(24px);pointer-events:none;z-index:0"></div>
  <div style="position:absolute;bottom:-240px;left:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(155,143,212,0.16),transparent 70%);filter:blur(24px);pointer-events:none;z-index:0"></div>

  <div style="position:relative;z-index:1;max-width:1320px;margin:0 auto">

    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:28px;flex-wrap:wrap">
      <div>
        <div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:14px">Catalog</div>
        <h1 style="margin:0;font-size:46px;font-weight:300;letter-spacing:-0.025em;line-height:1.02;color:var(--navy)">HireRight&#39;s agents, automations &amp; skills</h1>
      </div>
      <div style="display:flex;align-items:center;gap:22px">
        <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--coral);display:inline-block"></span><span style="font-size:13px;color:var(--ink-600)">Agent</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block"></span><span style="font-size:13px;color:var(--ink-600)">Automation</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--lavender);display:inline-block"></span><span style="font-size:13px;color:var(--ink-600)">Skill</span></div>
      </div>
    </div>

    <!-- SEARCH -->
    <div class="search" style="display:flex;align-items:center;gap:18px;background:var(--white);border:1px solid var(--ink-100);border-radius:var(--radius-pill);box-shadow:var(--shadow-md);padding:10px 10px 10px 30px;margin-bottom:40px">
      <input type="text" placeholder="What are you working on?" />
      <button class="addbtn" id="searchBtn" style="flex-shrink:0;height:52px;border:0;background:var(--coral);color:#fff;font-size:28px;font-weight:300;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center"><span class="addbtn-txt">+</span></button>
    </div>

    <div ref="{{ setGrid }}" style="display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:132px;gap:16px">

      <!-- FEATURED (2x2) -->
      <div data-cell style="grid-column:span 2;grid-row:span 2;transform-origin:50% 82%;will-change:transform">
        <div class="card" style="height:100%;position:relative;background:var(--gradient-warm);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform 260ms var(--ease-calm),box-shadow 260ms var(--ease-calm)" style-hover="transform:translateY(-5px);box-shadow:var(--shadow-glow)">
          <div style="position:absolute;inset:0;background-image:var(--grain);background-size:120px;pointer-events:none"></div>
          <div style="position:absolute;inset:0;background:linear-gradient(155deg,rgba(30,42,58,0.34) 0%,rgba(30,42,58,0.12) 34%,transparent 62%);pointer-events:none"></div>
          <div style="position:relative;padding:26px 28px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0">
            <div style="display:flex;align-items:center;gap:9px"><span style="width:8px;height:8px;border-radius:50%;background:var(--light-900)"></span><span style="font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--light-900)">Agent · Development · Discovery</span></div>
            <h2 style="margin:0;font-size:28px;font-weight:300;letter-spacing:-0.015em;color:var(--light-900);line-height:1.08">Explore the company harness</h2>
            <p style="margin:0;font-size:15px;line-height:1.55;color:var(--light-700);flex:1">Ask how anything works. Start shipping today, not next sprint.</p>
            <div style="height:1px;background:var(--light-200)"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
              <div style="display:flex;align-items:center;gap:11px">
                <div style="display:flex">
                  <img src="https://randomuser.me/api/portraits/women/44.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--white)" />
                  <img src="https://randomuser.me/api/portraits/men/32.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--white);margin-left:-10px" />
                  <img src="https://randomuser.me/api/portraits/men/75.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--white);margin-left:-10px" />
                </div>
                <span style="font-size:13px;color:var(--light-700)"><span style="font-weight:600;color:var(--light-900)">1,248</span> use this</span>
              </div>
              <span style="font-size:12px;color:var(--light-700);display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--light-900)"></span>Active</span>
            </div>
          </div>
        </div>
      </div>

      <!-- BUILD -->
      <div data-cell style="transform-origin:50% 82%;will-change:transform">
        <div class="card" style="height:100%;background:var(--white);border:1.5px solid rgba(242,112,89,0.45);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);cursor:pointer;overflow:hidden;transition:transform 260ms var(--ease-calm),box-shadow 260ms var(--ease-calm),border-color 260ms var(--ease-calm)" style-hover="transform:translateY(-5px);box-shadow:var(--shadow-glow);border-color:var(--coral)">
          <div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
            <div style="width:40px;height:40px;border-radius:50%;background:transparent;border:1.5px solid rgba(242,112,89,0.45);display:flex;align-items:center;justify-content:center;color:var(--navy);font-size:24px;font-weight:300;line-height:1">+</div>
            <div style="font-size:14px;font-weight:600;color:var(--navy)">Build your own</div>
          </div>
        </div>
      </div>

      <!-- PHOTO CELLS -->
      <sc-for list="{{ items }}" as="it" hint-placeholder-count="18">
        <div data-cell style="transform-origin:50% 82%;will-change:transform">
          <div class="card" style="height:100%;background:var(--white);border:1px solid var(--ink-100);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);cursor:pointer;padding:18px;display:flex;flex-direction:column;justify-content:space-between;transition:transform 260ms var(--ease-calm),box-shadow 260ms var(--ease-calm),border-color 260ms var(--ease-calm)" style-hover="transform:translateY(-5px);box-shadow:0 18px 40px rgba(30,42,58,0.13);border-color:rgba(30,42,58,0.14)">
            <div style="position:relative;width:30px;height:30px">
              <img src="{{ it.img }}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--ink-50)" />
              <span style="position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:{{ it.dot }};border:2px solid var(--white)"></span>
            </div>
            <div style="font-size:15.5px;font-weight:400;letter-spacing:-0.01em;color:var(--navy);line-height:1.22;text-wrap:pretty">{{ it.name }}</div>
          </div>
        </div>
      </sc-for>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rippleStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:22,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ripple&quot;},&quot;rippleReach&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:160,&quot;min&quot;:150,&quot;max&quot;:500,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ripple&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const A = 'var(--coral)', T = 'var(--teal)', S = 'var(--lavender)';
    const DOT = { a: A, t: T, s: S };
    const P = (g, n) => `https://randomuser.me/api/portraits/${g}/${n}.jpg`;
    const raw = [
      ['Inbox triage','a', P('men',45)],   ['Review replies','a', P('women',68)],
      ['Appointment reminders','t', P('men',11)], ['Weekly numbers','t', P('women',21)],
      ['Restock alerts','t', P('men',3)],  ['New-client welcome','a', P('women',90)],
      ['Quote drafts','a', P('men',22)],   ['Expense sorting','t', P('women',12)],
      ['Meeting notes','a', P('men',68)],  ['Order updates','t', P('women',33)],
      ['Refund requests','a', P('men',51)],['Supplier check-ins','a', P('women',55)],
      ['Waitlist fills','t', P('men',94)], ['Contract renewals','t', P('women',7)],
      ['Deposit reminders','t', P('men',9)], ['Feedback digest','a', P('women',26)],
      ['Shift swaps','t', P('men',40)],    ['Lead replies','a', P('women',63)],
      ['Payroll prep','t', P('men',60)],   ['Birthday notes','t', P('women',81)],
      ['Late reply nudges','a', P('men',77)], ['Bookkeeping tidy','t', P('women',48)],
      ['Proposal writer','s', P('women',5)], ['Board deck builder','s', P('men',48)],
    ];
    return {
      items: raw.map(([name, k, img]) => ({ name, img, dot: DOT[k] || A })),
      setGrid: (el) => { if (el && el !== this._grid) { this._grid = el; this._attach(el); } },
    };
  }

  _attach(grid) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (reduce || !fine) return;

    let lastCell = null;
    let lastT = 0;

    const ripple = (src) => {
      const now = performance.now();
      if (now - lastT < 60) return;
      lastT = now;
      const strength = this.props.rippleStrength ?? 10;
      const reach = this.props.rippleReach ?? 300;
      const cells = grid.querySelectorAll('[data-cell]');
      const s = src.getBoundingClientRect();
      const sx = s.left + s.width / 2, sy = s.top + s.height / 2;
      cells.forEach((c) => {
        const r = c.getBoundingClientRect();
        const dx = r.left + r.width / 2 - sx;
        const dy = r.top + r.height / 2 - sy;
        const dist = Math.hypot(dx, dy);
        const amp = strength * Math.exp(-dist / reach);
        if (amp < 0.4) return;
        const delay = dist * 0.42;
        const lean = (dx >= 0 ? 1 : -1) * amp * 0.14;
        c.animate([
          { transform: 'translateY(0) rotate(0deg)' },
          { transform: `translateY(${-amp}px) rotate(${lean}deg)`, offset: 0.36 },
          { transform: 'translateY(0) rotate(0deg)' },
        ], { duration: 640, delay, easing: 'cubic-bezier(0.23,1,0.32,1)' });
      });
    };

    grid.addEventListener('pointerover', (e) => {
      const cell = e.target.closest('[data-cell]');
      if (!cell || !grid.contains(cell) || cell === lastCell) return;
      lastCell = cell;
      ripple(cell);
    });
    grid.addEventListener('pointerleave', () => { lastCell = null; });
  }
}
</script>
<script>
(function(){
  // delegated on document: survives the React remount that replaces
  // the search bar's DOM nodes after this script first runs
  var lastActive = null;
  var debounce = null;
  function morph(active, txt, btn){
    txt.style.opacity = '0';
    setTimeout(function(){
      txt.textContent = active ? 'Find your agent' : '+';
      txt.style.fontSize = active ? '15px' : '28px';
      txt.style.fontWeight = active ? '500' : '300';
      btn.setAttribute('data-active', active ? '1' : '0');
      txt.style.opacity = '1';
    }, 220);
  }
  document.addEventListener('input', function(e){
    if(!e.target.matches('.search input')) return;
    var btn = document.getElementById('searchBtn');
    if(!btn) return;
    var txt = btn.querySelector('.addbtn-txt');
    if(!txt) return;
    var hasText = e.target.value.trim().length > 0;
    clearTimeout(debounce);
    if(!hasText){
      // clearing the field reverts right away
      if(lastActive !== false){ lastActive = false; morph(false, txt, btn); }
      return;
    }
    // wait for a pause in typing before morphing, so it doesn't
    // interrupt mid-keystroke
    debounce = setTimeout(function(){
      if(lastActive === true) return;
      lastActive = true;
      morph(true, txt, btn);
    }, 500);
  }, true);
})();
</script>
</body>
</html>
