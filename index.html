<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/colors.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/typography.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/tokens/effects.css">
  <link rel="stylesheet" href="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/styles.css">
  <script src="_ds/hours-design-system-a6c7f78c-f8d3-4aba-92a6-47ac35215e3e/_ds_bundle.js"></script>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{background:var(--surface-light);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
    a{color:var(--coral-deep);text-decoration:none}
    a:hover{color:var(--coral)}

    .search{transition:box-shadow 220ms cubic-bezier(0.23,1,0.32,1),border-color 220ms cubic-bezier(0.23,1,0.32,1)}
    .search:focus-within{border-color:rgba(242,112,89,0.45);box-shadow:var(--shadow-glow)}
    .search input{width:100%;border:0;outline:0;background:transparent;font-family:var(--font-sans);font-size:20px;font-weight:300;letter-spacing:-0.01em;color:var(--navy)}
    .search input::placeholder{color:var(--ink-400);font-weight:300}
    .addbtn{transition:transform 160ms cubic-bezier(0.23,1,0.32,1),background 160ms cubic-bezier(0.23,1,0.32,1)}
    .addbtn:hover{background:var(--coral-deep)}
    .addbtn:active{transform:scale(0.97)}

    /* level 1 — department. mechanism: coral underline */
    .filt{position:relative;background:none;border:0;padding:4px 2px;cursor:pointer;font-family:var(--font-sans);font-size:14px;font-weight:400;letter-spacing:-0.01em;color:var(--ink-400);transition:color 200ms cubic-bezier(0.23,1,0.32,1)}
    .filt:hover{color:var(--ink-700)}
    .filt[data-on="1"]{color:var(--coral-deep);font-weight:500}
    .filt::after{content:"";position:absolute;left:2px;right:2px;bottom:-3px;height:1.5px;background:var(--coral);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform 260ms cubic-bezier(0.23,1,0.32,1)}
    .filt[data-on="1"]::after{transform:scaleX(1)}

    /* level 2 — reveals by growing its own row, so nothing reserves space when closed */
    .subwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows 300ms cubic-bezier(0.23,1,0.32,1)}
    .subwrap[data-open="1"]{grid-template-rows:1fr}
    /* level 2 — sub-facet. different mechanism: a coral dot, not an underline */
    .sub{display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:3px 2px;cursor:pointer;font-family:var(--font-sans);font-size:12.5px;font-weight:400;letter-spacing:0;color:var(--ink-400);transition:color 200ms cubic-bezier(0.23,1,0.32,1)}
    .sub:hover{color:var(--ink-700)}
    .sub[data-on="1"]{color:var(--navy);font-weight:500}
    .sub .d{width:5px;height:5px;border-radius:50%;background:var(--coral);opacity:0;transform:scale(0.5);transition:opacity 200ms cubic-bezier(0.23,1,0.32,1),transform 200ms cubic-bezier(0.23,1,0.32,1)}
    .sub[data-on="1"] .d{opacity:1;transform:scale(1)}

    @media (prefers-reduced-motion:reduce){
      .card{transition:box-shadow 160ms ease,border-color 160ms ease !important;transform:none !important}
      .subwrap{transition:none}
    }
  </style>
</helmet>

<div style="position:relative;min-height:100vh;padding:52px 56px 72px;overflow:hidden">
  <div style="position:absolute;inset:0;pointer-events:none;background-image:var(--grain);background-size:180px;opacity:0.45;z-index:0"></div>
  <div style="position:absolute;top:-180px;right:-120px;width:520px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,136,0.22),transparent 70%);filter:blur(24px);pointer-events:none;z-index:0"></div>
  <div style="position:absolute;bottom:-240px;left:-160px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(155,143,212,0.16),transparent 70%);filter:blur(24px);pointer-events:none;z-index:0"></div>

  <div style="position:relative;z-index:1;max-width:1320px;margin:0 auto">

    <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:32px;margin-bottom:28px;flex-wrap:wrap">
      <div>
        <div style="font-size:10px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--coral-deep);margin-bottom:14px">Catalog</div>
        <h1 style="margin:0;font-size:46px;font-weight:300;letter-spacing:-0.025em;line-height:1.02;color:var(--navy)">HireRight&#39;s agents &amp; automations</h1>
      </div>
      <div style="display:flex;align-items:center;gap:22px">
        <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--coral);display:inline-block"></span><span style="font-size:13px;color:var(--ink-700)">Agent</span></div>
        <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block"></span><span style="font-size:13px;color:var(--ink-700)">Automation</span></div>
      </div>
    </div>

    <div class="search" style="display:flex;align-items:center;gap:18px;background:var(--white);border:1px solid var(--ink-100);border-radius:var(--radius-pill);box-shadow:var(--shadow-md);padding:10px 10px 10px 30px;margin-bottom:22px">
      <input type="text" placeholder="What are you working on?" />
      <button class="addbtn" style="flex-shrink:0;width:52px;height:52px;border:0;border-radius:50%;background:var(--coral);color:#fff;font-size:28px;font-weight:300;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center">+</button>
    </div>

    <div ref="{{ setFilters }}" style="margin-bottom:34px">
      <div style="display:flex;align-items:center;gap:26px;padding:0 6px;flex-wrap:wrap">
        <sc-for list="{{ depts }}" as="d" hint-placeholder-count="6">
          <button class="filt" data-on="{{ d.on }}" onClick="{{ d.select }}">{{ d.label }}</button>
        </sc-for>
      </div>
      <div class="subwrap" data-open="{{ subOpen }}">
        <div style="overflow:hidden">
          <div style="display:flex;align-items:center;gap:20px;padding:15px 6px 0;flex-wrap:wrap">
            <sc-for list="{{ subs }}" as="s" hint-placeholder-count="5">
              <button class="sub" data-on="{{ s.on }}" onClick="{{ s.select }}"><span class="d"></span>{{ s.label }}</button>
            </sc-for>
          </div>
        </div>
      </div>
    </div>

    <div ref="{{ setGrid }}" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-auto-rows:132px;gap:16px">

      <sc-if value="{{ showFeatured }}" hint-placeholder-val="{{ true }}">
        <div data-cell style="grid-column:span 2;grid-row:span 2;transform-origin:50% 82%;will-change:transform">
          <div class="card" style="height:100%;background:var(--white);border:1px solid var(--ink-100);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);cursor:pointer;overflow:hidden;display:flex;flex-direction:column;transition:transform 260ms cubic-bezier(0.23,1,0.32,1),box-shadow 260ms cubic-bezier(0.23,1,0.32,1),border-color 260ms cubic-bezier(0.23,1,0.32,1)" style-hover="transform:translateY(-5px);box-shadow:0 22px 54px rgba(30,42,58,0.15);border-color:rgba(242,112,89,0.4)">
            <div style="height:5px;background:var(--gradient-strip);flex-shrink:0"></div>
            <div style="padding:24px 28px;display:flex;flex-direction:column;gap:14px;flex:1;min-height:0">
              <div style="display:flex;align-items:center;gap:9px"><span style="width:8px;height:8px;border-radius:50%;background:var(--teal)"></span><span style="font-size:10px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-500)">Automation · Finance · Invoices</span></div>
              <h2 style="margin:0;font-size:28px;font-weight:300;letter-spacing:-0.015em;color:var(--navy);line-height:1.08">Invoice follow-ups</h2>
              <p style="margin:0;font-size:15px;line-height:1.55;color:var(--ink-700);flex:1">Chases unpaid invoices for you — gently, in your voice.</p>
              <div style="height:1px;background:var(--ink-100)"></div>
              <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
                <div style="display:flex;align-items:center;gap:11px">
                  <div style="display:flex">
                    <img src="https://randomuser.me/api/portraits/women/44.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--white)" />
                    <img src="https://randomuser.me/api/portraits/men/32.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--white);margin-left:-10px" />
                    <img src="https://randomuser.me/api/portraits/men/75.jpg" style="width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--white);margin-left:-10px" />
                  </div>
                  <span style="font-size:13px;color:var(--ink-500)"><span style="font-weight:600;color:var(--navy)">1,248</span> use this</span>
                </div>
                <span style="font-size:12px;color:var(--ink-500);display:flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:50%;background:var(--teal)"></span>Active</span>
              </div>
            </div>
          </div>
        </div>
      </sc-if>

      <div data-cell style="transform-origin:50% 82%;will-change:transform">
        <div class="card" style="height:100%;position:relative;border-radius:var(--radius-xl);box-shadow:var(--shadow-md);cursor:pointer;overflow:hidden;background:var(--gradient-warm);transition:transform 260ms cubic-bezier(0.23,1,0.32,1),box-shadow 260ms cubic-bezier(0.23,1,0.32,1)" style-hover="transform:translateY(-5px);box-shadow:var(--shadow-glow)">
          <div style="position:absolute;inset:0;background-image:var(--grain);background-size:120px"></div>
          <div style="position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
            <div style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.25);border:1px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;font-weight:300;line-height:1">+</div>
            <div style="font-size:14px;font-weight:600;color:#fff">Build your own</div>
          </div>
        </div>
      </div>

      <sc-for list="{{ items }}" as="it">
        <div data-cell style="transform-origin:50% 82%;will-change:transform">
          <div class="card" style="height:100%;background:var(--white);border:1px solid var(--ink-100);border-radius:var(--radius-xl);box-shadow:var(--shadow-sm);cursor:pointer;padding:18px;display:flex;flex-direction:column;justify-content:space-between;transition:transform 260ms cubic-bezier(0.23,1,0.32,1),box-shadow 260ms cubic-bezier(0.23,1,0.32,1),border-color 260ms cubic-bezier(0.23,1,0.32,1)" style-hover="transform:translateY(-5px);box-shadow:0 18px 40px rgba(30,42,58,0.13);border-color:rgba(30,42,58,0.14)">
            <div style="position:relative;width:30px;height:30px">
              <img src="{{ it.img }}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;background:var(--ink-100)" />
              <span style="position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;background:{{ it.dot }};border:2px solid var(--white)"></span>
            </div>
            <div style="font-size:15.5px;font-weight:400;letter-spacing:-0.01em;color:var(--navy);line-height:1.22;text-wrap:pretty">{{ it.name }}</div>
          </div>
        </div>
      </sc-for>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;rippleStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:4,&quot;min&quot;:0,&quot;max&quot;:22,&quot;step&quot;:1,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ripple&quot;},&quot;rippleReach&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:160,&quot;min&quot;:150,&quot;max&quot;:500,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Ripple&quot;}}">
const DEPTS = [
  ['all', 'All', []],
  ['development', 'Development', ['Product', 'Design', 'Plan', 'Build', 'Test', 'Ship']],
  ['sales', 'Sales', ['Leads', 'Quotes', 'Follow-ups', 'Renewals']],
  ['marketing', 'Marketing', ['Content', 'Social', 'Campaigns', 'Reviews']],
  ['hr', 'HR', ['Hiring', 'Onboarding', 'Scheduling', 'Payroll']],
  ['finance', 'Finance', ['Invoices', 'Expenses', 'Reporting', 'Suppliers']],
];

const P = (g, n) => `https://randomuser.me/api/portraits/${g}/${n}.jpg`;

// [name, kind(a=agent/t=automation), photo, department, sub-facet]
const RAW = [
  ['Ticket intake','t',P('men',22),'development','Product'],
  ['Requirement gaps','a',P('men',9),'development','Product'],
  ['Questions for product','a',P('men',68),'development','Product'],
  ['Context gathering','a',P('women',48),'development','Product'],

  ['Design handoff','a',P('women',65),'development','Design'],
  ['Screenshot tidy','t',P('men',40),'development','Design'],
  ['UI verification','a',P('women',26),'development','Design'],

  ['Root cause analysis','a',P('men',77),'development','Plan'],
  ['Implementation plans','a',P('men',52),'development','Plan'],
  ['Codebase questions','a',P('women',9),'development','Plan'],

  ['Writing code','a',P('men',45),'development','Build'],
  ['Bug fixes','a',P('women',33),'development','Build'],
  ['Decision log','t',P('men',11),'development','Build'],

  ['Test failures','a',P('women',63),'development','Test'],
  ['Flaky test finder','t',P('men',94),'development','Test'],
  ['Prompt test runs','a',P('women',90),'development','Test'],
  ['Playground deploys','t',P('men',3),'development','Test'],

  ['Code review','a',P('men',51),'development','Ship'],
  ['Draft PRs','t',P('women',21),'development','Ship'],
  ['CI watch','a',P('women',7),'development','Ship'],
  ['Release notes','a',P('men',60),'development','Ship'],

  ['Inbox triage','a',P('men',11),'sales','Leads'],
  ['Lead replies','a',P('women',63),'sales','Leads'],
  ['Waitlist fills','t',P('men',94),'sales','Leads'],
  ['Quote drafts','a',P('women',90),'sales','Quotes'],
  ['Price lookups','t',P('men',3),'sales','Quotes'],
  ['New-client welcome','a',P('women',33),'sales','Follow-ups'],
  ['Appointment reminders','t',P('men',51),'sales','Follow-ups'],
  ['Order updates','t',P('women',21),'sales','Follow-ups'],
  ['Contract renewals','t',P('women',7),'sales','Renewals'],

  ['Blog drafts','a',P('women',68),'marketing','Content'],
  ['Newsletter prep','t',P('men',60),'marketing','Content'],
  ['Social scheduler','t',P('women',81),'marketing','Social'],
  ['Campaign recaps','t',P('men',85),'marketing','Campaigns'],
  ['Review replies','a',P('women',55),'marketing','Reviews'],
  ['Feedback digest','a',P('men',32),'marketing','Reviews'],

  ['Candidate replies','a',P('men',75),'hr','Hiring'],
  ['Interview scheduling','t',P('women',12),'hr','Hiring'],
  ['Onboarding buddy','t',P('women',44),'hr','Onboarding'],
  ['First-week checklist','t',P('men',18),'hr','Onboarding'],
  ['Shift swaps','t',P('men',36),'hr','Scheduling'],
  ['Payroll prep','t',P('women',72),'hr','Payroll'],

  ['Refund requests','a',P('men',54),'finance','Invoices'],
  ['Deposit reminders','t',P('women',39),'finance','Invoices'],
  ['Expense sorting','t',P('women',16),'finance','Expenses'],
  ['Receipt matching','t',P('men',29),'finance','Expenses'],
  ['Weekly numbers','t',P('women',28),'finance','Reporting'],
  ['Restock alerts','t',P('men',64),'finance','Suppliers'],
  ['Supplier check-ins','a',P('women',57),'finance','Suppliers'],
];

class Component extends DCLogic {
  state = { dept: 'all', sub: null };

  renderVals() {
    const { dept, sub } = this.state;
    const A = 'var(--coral)', T = 'var(--teal)';

    const items = RAW
      .filter(([, , , d, s]) => (dept === 'all' || d === dept) && (!sub || s === sub))
      .map(([name, k, img]) => ({ name, img, dot: k === 'a' ? A : T }));

    const depts = DEPTS.map(([id, label]) => ({
      label,
      on: dept === id ? '1' : '0',
      select: () => {
        if (this.state.dept === id) return;
        this.setState({ dept: id, sub: null });
      },
    }));

    const active = DEPTS.find(([id]) => id === dept);
    const subs = (active ? active[2] : []).map((label) => ({
      label,
      on: sub === label ? '1' : '0',
      // clicking the selected facet clears it — the department stays
      select: () => this.setState({ sub: sub === label ? null : label }),
    }));

    return {
      items, depts, subs,
      subOpen: subs.length ? '1' : '0',
      showFeatured: (dept === 'all' || dept === 'finance') && (!sub || sub === 'Invoices'),
      setGrid: (el) => { if (el && el !== this._grid) { this._grid = el; this._attach(el); } },
      setFilters: (el) => { this._filters = el; },
    };
  }

  componentDidUpdate(_, prev) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce) return;
    // grid restaged: brief staggered settle so the eye follows what changed
    if (prev.dept !== this.state.dept || prev.sub !== this.state.sub) {
      this._stagger(this._grid, '[data-cell]', 6, 26);
      if (prev.dept !== this.state.dept) this._stagger(this._filters, '.sub', 5, 34);
    }
  }

  _stagger(root, sel, dy, step) {
    if (!root) return;
    root.querySelectorAll(sel).forEach((el, i) => {
      el.animate(
        [{ opacity: 0, transform: `translateY(${dy}px)` }, { opacity: 1, transform: 'translateY(0)' }],
        { duration: 300, delay: Math.min(i, 14) * step, easing: 'cubic-bezier(0.23,1,0.32,1)', fill: 'backwards' },
      );
    });
  }

  _attach(grid) {
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    if (reduce || !fine) return;

    let lastCell = null;
    let lastT = 0;

    const ripple = (src) => {
      const now = performance.now();
      if (now - lastT < 60) return;
      lastT = now;
      const strength = this.props.rippleStrength ?? 4;
      const reach = this.props.rippleReach ?? 160;
      const cells = grid.querySelectorAll('[data-cell]');
      const s = src.getBoundingClientRect();
      const sx = s.left + s.width / 2, sy = s.top + s.height / 2;
      cells.forEach((c) => {
        const r = c.getBoundingClientRect();
        const dx = r.left + r.width / 2 - sx;
        const dy = r.top + r.height / 2 - sy;
        const dist = Math.hypot(dx, dy);
        const amp = strength * Math.exp(-dist / reach);
        if (amp < 0.4) return;
        const delay = dist * 0.42;
        const lean = (dx >= 0 ? 1 : -1) * amp * 0.14;
        c.animate([
          { transform: 'translateY(0) rotate(0deg)' },
          { transform: `translateY(${-amp}px) rotate(${lean}deg)`, offset: 0.36 },
          { transform: 'translateY(0) rotate(0deg)' },
        ], { duration: 640, delay, easing: 'cubic-bezier(0.23,1,0.32,1)' });
      });
    };

    grid.addEventListener('pointerover', (e) => {
      const cell = e.target.closest('[data-cell]');
      if (!cell || !grid.contains(cell) || cell === lastCell) return;
      lastCell = cell;
      ripple(cell);
    });
    grid.addEventListener('pointerleave', () => { lastCell = null; });
  }
}
</script>
</body>
</html>
